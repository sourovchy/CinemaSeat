server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames under /assets — safe to cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Same-origin API: the SPA only ever calls relative /api/* URLs. Forward
    # them to the backend over the compose network so no CORS is needed and
    # the frontend bundle stays free of environment-specific hostnames.
    location /api/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend liveness/readiness stay reachable at the public origin, so a
    # deployed URL answers /health without exposing port 3000 separately.
    location = /health {
        proxy_pass http://app:3000/health;
    }
    location = /ready {
        proxy_pass http://app:3000/ready;
    }

    # SPA fallback: a browser refresh on /theatres, /shows/1/seats,
    # /bookings/<ref>/pay etc. must serve index.html, never 404.
    location / {
        try_files $uri /index.html;
    }
}
